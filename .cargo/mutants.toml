  'app/multi_cursor_glue\.rs:77:13:',  # mc_reconcile_owner `is_active() || !secondaries.is_empty()`: unreachable divergence. The `||` on the NEXT line (also column 13, identical description) guards column_anchor and IS tested.
  'app/multi_cursor_glue\.rs:94:13:',  # mc_record_owner: same predicate, same name+column collision with the tested `||` below it.
