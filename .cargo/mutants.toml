# cargo-mutants config for scr1b3.
#
# Applies to BOTH the per-PR `mutation-in-diff` gate and the scheduled
# `mutation` / `mutation-app` jobs. The excluded files have NO unit-testable
# logic — egui/eframe per-frame render loops, native rfd dialogs, OS-shell
# integration, and the app bootstrap. Excluding them stops the gates reporting
# vacuous survivors on code that CANNOT be exercised without a live GUI/OS
# (ADR-0007 §3) — the "rfd dialogs mask mutation verdicts" failure that commits
# 5d6af04 / 7569a9a fixed at the CLI level, now made durable and consistent
# across every mutation run.
#
# MIXED files (mod.rs, render_support.rs, text_ops_methods.rs, builtins.rs, …)
# are DELIBERATELY NOT glob-excluded here: they carry real logic that must stay
# mutation-gated. Their individual UI-render functions are excluded one at a
# time by NAME in the `exclude_re` array below, each with an ADR-0007
# justification — never by a whole-file glob that would silently hide the logic
# sharing the file (a green-that-isn't-green).
#
# This comment previously claimed those functions were excluded "precisely via
# `#[cfg_attr(test, mutants::skip)]` on the function … never by a broad
# file/regex glob". That was false in both halves, and is corrected here rather
# than left describing a mechanism the file does not use. There is not one
# `mutants::skip` attribute anywhere in this tree (`git grep mutants::skip`
# returns a single hit, and it is a COMMENT); the exclusions are, and always
# were, `exclude_re` name tokens — exactly the shape the old text disclaimed.
# A doc that describes the safe design while the file implements the one it
# warns against is worse than no doc: it retires the reader's suspicion without
# retiring the risk.
#
# What that means for the two residual risks in the array, and what holds them:
#
#   * A bare function-name token is a SUBSTRING match. Every name token below is
#     `\b`-bounded for that reason, so `\bshow_minimap\b` cannot also swallow a
#     `show_minimap_legend` added later. Where a bare word is shared across files
#     (`show`) the token is additionally file-qualified.
#   * `'<impl eframe::App for ScribeApp>'` is a genuine blanket over every method
#     of that impl — present AND future. It is kept (all three of
#     clear_color/save/ui are live-frame/eframe-host only, with no headless
#     observable), but it is no longer unbounded in time: the test
#     `the_eframe_app_blanket_pardon_covers_only_the_documented_methods` in
#     crates/scribe-app/tests/mutation_pardons_are_not_stale.rs pins that impl's
#     method set, so adding a fourth method turns the suite RED and forces the
#     pardon decision to be made explicitly instead of inherited.

exclude_globs = [
  # egui/eframe per-frame render + modal painting (no testable logic)
  "crates/scribe-app/src/app/frame_tick.rs",
  "crates/scribe-app/src/app/frame_modals.rs",
  "crates/scribe-app/src/app/modals.rs",
  "crates/scribe-app/src/app/grid_render.rs",
  "crates/scribe-app/src/app/toolbar_render.rs",
  # rfd native file dialogs (unreachable offline)
  "crates/scribe-app/src/app/dialogs.rs",
  # app + OS bootstrap / shell integration side-effects
  "crates/scribe-app/src/main.rs",
  "crates/scribe-app/src/integration/mod.rs",
  "crates/scribe-app/src/integration/linux.rs",
  "crates/scribe-app/src/integration/windows.rs",
]

# Exclude the heavy scale/perf test modules from every mutation TEST RUN.
#
# cargo-mutants re-runs the whole test suite once per mutant. The non-ignored
# scale tests (s5 ~53s, s11 ~31s in qa_largefile_scale_tests; scenario3 ~32s in
# qa_find_scale_tests) drag the scribe-app baseline from ~33s to ~73s — a cost
# paid on EVERY mutant, and enough to blow a tight per-mutant timeout. These
# tests assert panic-freedom / no-OOB at size N; they do NOT assert fine-grained
# logic, so they kill ~no logic mutant a fast unit test doesn't already kill, and
# the scale-SENSITIVE logic (mmap threshold, chunking) lives in scribe-core,
# which has its own mutation coverage. Excluding them keeps the run tractable
# without dropping logic kill-power. (This is a TEST-selection filter, not a
# code-exclusion glob — the scale MODULES' own source can still be mutated; only
# their slow tests are skipped while OTHER tests hunt those mutants.)
additional_cargo_test_args = [
  "-E",
  "not (test(/qa_largefile_scale_tests/) | test(/qa_find_scale_tests/))",
]

# nextest is the test tool for every mutation run. Making it the config default
# (not just a per-invocation `--test-tool nextest` flag) keeps the `-E` filter
# above valid on ANY invocation — a plain `cargo test` would reject `-E` and fail
# the baseline. All CI jobs already pass `--test-tool nextest`; this removes the
# footgun for ad-hoc local runs.
test_tool = "nextest"

# HOW TO ANCHOR A PARDON (read before adding one)
#
# `exclude_re` is matched against the mutant NAME exactly as `cargo mutants
# --list` prints it: `path/to/file.rs:LINE:COL: <description>`. Anchor on the
# DESCRIPTION, never on the LINE.
#
# A line number is not a stable key. Any edit ABOVE it slides the anchor onto a
# different statement, and the pardon then suppresses the wrong mutant — or
# nothing at all — while still looking like coverage. That is not hypothetical:
# `text_ops_methods.rs:418` drifted to 423 and landed on a comment;
# `md_preview.rs:279` slid onto `None => MdBlock::ListItem {` and `:289` onto a
# doc comment; and the migration pass that wrote this header found EIGHT MORE
# anchors already matching zero mutants and one (`drag_scroll.rs:189`) silently
# pardoning an unrelated `page_key_assist` mutant.
#
# Get the authoritative description from the tool, not from memory:
#
#     cargo mutants --list --no-config --line-col true -f <path/to/file.rs>
#
# then regex-escape the description text and use that as the entry.
#
# When a bare description would match SEVERAL mutants and over-suppress a
# neighbour the tests actually kill, pin the mutant's COLUMN and leave the LINE
# as `\d+` — e.g. `'find_in_files\.rs:\d+:32: replace > with (==|<|>=) in
# walk_project'`. A column does not move when something ABOVE it is edited, so
# it closes the VERTICAL half of the rotation class, and the pardon stays
# exactly as tight as a line anchor was. Over-suppression is worse than
# rotation: never widen a description to swallow a mutant you did not mean to
# pardon.
#
# A COLUMN IS NOT ROTATION-PROOF. An earlier version of this header claimed the
# rotation class was "still closed" once the line was wildcarded. It is not:
# re-indenting the line (wrapping the block in an `if`) or renaming an
# identifier to the LEFT of the pardoned operator moves the column, and the
# anchor then matches nothing — or comes to rest on a DIFFERENT operator at the
# same column and silently pardons the wrong mutant. That is the original
# `drag_scroll.rs:189` -> `page_key_assist` failure reproduced horizontally.
#
# So every pardon that pins a coordinate — LINE-pinned or COLUMN-pinned — must
# be registered in `POSITIONAL_ANCHORS` in
# `crates/scribe-app/tests/mutation_pardons_are_not_stale.rs`, together with the
# source text that must still sit at each pinned column. That test verifies both
# axes on every run and REJECTS any unregistered coordinate anchor, in any regex
# spelling (escaped colons, character classes, parenthesised or `\d`-substituted
# numbers, and a bare `:LINE:COL:` with no filename all classify the same).

# Pardoned mutants (equivalent or untestable — never a floor-lowering shortcut):
#
# - `action_log::path -> Option<&'static PathBuf>` body mutants (`-> None`,
#   `-> Some(default)`): `path` is a process-global first-caller-wins `OnceLock`
#   cache over `resolve_log_path`. 8 production `record` call sites prime it and
#   app-level tests trigger them under a shared `cargo test` process, so its
#   cached value is fixed for the binary's lifetime and a body mutation cannot be
#   observed deterministically by a unit test. The RESOLUTION logic it caches is
#   fully covered by the `resolve_log_path` unit tests; only this untestable cache
#   wrapper is pardoned. See crates/scribe-app/src/action_log.rs.
#
# - `reporting::log_outcome -> ()` (the thin wrapper only): `log_outcome` forwards
#   to `log_outcome_with`, whose sole side effect is `action_log::record` — which
#   routes through that same process-global first-caller-wins `OnceLock` path
#   cache, so "did the wrapper call the real sink" is not deterministically
#   observable under a shared-process test runner. The GATE + payload logic is
#   split into `log_outcome_with` and fully covered (telemetry-enabled forwards,
#   telemetry-disabled suppresses) with a capturing sink. The `\(\)` bound matches
#   the wrapper's whole-body mutant ONLY, never `log_outcome_with` (the `_with`
#   breaks the ` with ` match). See crates/scribe-app/src/reporting.rs.
#   FILE-QUALIFIED as of this pass. The justification above reasons entirely
#   about reporting.rs, but scribe-app has TWO free `fn log_outcome` returning
#   `()` — reporting.rs:81 (this thin wrapper) and issue_intake.rs:308, which is
#   NOT a wrapper: it carries its own `S4F3_DISABLE_TELEMETRY` gate and then
#   calls `action_log::record`. cargo-mutants names free functions bare, so the
#   old unqualified `'replace log_outcome with \(\)'` matched BOTH and silently
#   stretched a reporting.rs rationale over an unrelated function. Scoping it to
#   reporting.rs is a TIGHTENING, not a widening. It may surface a survivor on
#   issue_intake::log_outcome — that gate is genuinely testable (inject a sink,
#   as reporting.rs does) and the honest signal is a real test gap, not a
#   pardon. Do NOT re-broaden this pattern to silence it.
# - effects.rs CRT/VHS paint functions (6): each takes `ctx: &egui::Context` and
#   paints directly (`ctx.layer_painter(...).rect_filled/circle_filled/line_segment`);
#   their internal alpha/phase/drift/position arithmetic is observable ONLY through
#   GPU-painted pixels (ADR-0007 "egui-paint" — no return value, no assertable
#   state). Confirmed by a real 197-mutant run: ALL 14 MISSED land in exactly these
#   6 functions; the one pure helper `wired_mesh_node_count` is separately tested
#   (the run's 1 caught) and its token does NOT collide with `paint_wired_mesh`.
#   paint_tint_overlay is a deliberate no-op stub with NO surviving mutant, so it is
#   NOT pardoned here (only confirmed survivors are excluded).
# Pure egui-render (paint-only) functions — ADR-0007 "egui-paint" policy.
# Each takes `&mut egui::Ui` / `&egui::Context` and its every surviving mutant is
# observable ONLY through GPU-painted pixels / live-frame widget interaction (no
# return value or app-observable state a headless unit test can assert). The pure
# LOGIC each once inlined is EXTRACTED and separately unit-tested (e.g.
# apply_toolbar_drop/apply_keyboard_move for the toolbar editors, resize_dir_at
# for handle_frameless_resize, minimap_geometry for show_minimap, blend_tint/
# lerp_rgb for the tint path, sync_grid_state for the grid panel) — those tested
# helpers are NOT in these functions, so a whole-function pardon hides no logic
# gap. Each token is a `\b`-bounded function name confirmed to resolve to exactly
# ONE function in ONE file (no substring/cross-file collision). `show` is
# file-scoped because the bare word is shared by settings.rs and md_preview.rs.
exclude_re = [
  # hit_test.rs `classify`: `caption_height > 0` vs `>= 0` are equivalent.
  # `classify` early-returns Client unless `geo.client.contains(x, y)`, and
  # `contains` requires `y >= client.top` — so the third conjunct
  # `y < client.top + caption_height` already IMPLIES `caption_height > 0`.
  # The guard is a redundant short-circuit: the two differ only at ch == 0,
  # where conjunct 3 is false either way. Confirmed empirically over 952,560
  # classify calls (both modes x caption_height in {-3,-1,0,1,2,34} x 3 client
  # rects incl. negative/offset tops x maximized x border in {0,1,8} x 3
  # max-button variants x boundary x/y): byte-identical output.
  # NOTE: this rests on the `!geo.client.contains(x, y)` early return. If that
  # guard is ever removed, DROP this pardon — it would start hiding a real bug.
  'hit_test\.rs.*replace > with >= in classify',
  # scribe-win32-chrome/src/lib.rs: the `#[cfg(windows)]` thin wrappers that
  # delegate to `imp`. Not compiled on the ubuntu mutation runner, so 100% of
  # their mutants are vacuous MISSES no test could ever kill — the same
  # condition ci.yml already excludes `imp.rs` and `integration/windows.rs` for.
  # Bounded to `with \(\)` deliberately: each has a `#[cfg(not(windows))]` stub
  # with an EMPTY body, which generates no `with ()` mutant of its own, so these
  # patterns cannot reach a compiled definition. The two `-> bool` members of
  # this family are NOT listed here — their stubs return a real value and DO
  # generate mutants that are currently caught, so they are re-exported from
  # `imp.rs` instead (see `the_non_windows_stubs_are_never_mutation_excluded`).
  'replace set_maximize_button_rect with \(\)',
  'replace clear_maximize_button_rect with \(\)',
  'replace set_hit_test_mode with \(\)',
  'replace set_snap_support_enabled with \(\)',
  'replace show_system_menu with \(\)',
  'replace apply_rounded_corners with \(\)',
  'replace set_backdrop with \(\)',
  "replace path -> Option<&'static PathBuf>",
  'reporting\.rs.*replace log_outcome with \(\)',
  # `\b`-bounded like every other name token in this array. These seven were the
  # only unbounded SUBSTRINGS left: as a bare `"paint_flicker"` the token would
  # also have swallowed a `paint_flicker_overlay` added later, pardoning a
  # function nobody justified. Note the LITERAL quotes — in a TOML *basic*
  # string `"\b"` is a backspace escape, not a regex word boundary.
  '\bpaint_crt_scanlines\b',
  '\bpaint_flicker\b',
  '\bpaint_vhs_tracking\b',
  '\bpaint_wired_mesh\b',
  '\bpaint_caret_trail\b',
  '\bpaint_boot_glitch\b',
  '\bpaint_squiggle\b',  # render_support.rs spellcheck-underline paint: painter.line_segment only (GPU pixels, no return/observable state) — ADR-0007 egui-paint
  # settings.rs settings-panel render surfaces
  '\brender_sections\b',
  '\brender_update_status\b',
  '\brender_toolbar_editor\b',
  '\btoolbar_list_editor\b',
  'settings\.rs.*\bshow\b',
  # app/chrome.rs frameless-window chrome painting
  '\bcaption_btn\b',
  '\bhandle_frameless_resize\b',
  # app/editor_overlays.rs minimap panel paint (geometry extracted + tested)
  '\bshow_minimap\b',
  # app/tab_strip_render.rs tab-chip paint
  '\bdraw_tab_strip\b',
  # app/theme_visuals.rs — writes egui global style only
  '\bapply_motion_style\b',
  # theme_editor.rs — map.insert gated behind a live color-picker interaction
  '\btoken_grid_row\b',
  # app/render_support.rs grip-dot coordinate paint
  '\bgrip_handle\b',
  # md_preview.rs markdown render surfaces (parse logic tested separately)
  '\brender_runs\b',
  '\brender_text_with_tags\b',
  'md_preview\.rs.*\bshow\b',
  # plugin_manager.rs registry/loaded list paint
  '\bshow_loaded\b',
  '\bshow_registry\b',
  # app/grid_methods.rs central grid panel paint (sync_grid_state tested separately)
  '\brender_grid_central_panel\b',
  # app/mod.rs painted wordmark LayoutJob
  '\btoolbar_widget\b',
  # app/drag_scroll.rs per-frame input/scroll glue (scroll math extracted + tested)
  '\bcaret_scroll_off_assist\b',
  '\bdrag_scroll_assist\b',
  # updater.rs OS-shell spawn / env-dependent IO side effects (no deterministic observable)
  '\blaunch_installer_elevated\b',
  '\brunning_exe_dir_writable\b',
  '\bstart_check\b',
  # app/text_ops_methods.rs — reached only via live egui TextEditState cursor data
  '\bactive_line_span\b',

  # --- Convergence pass (from the full-tree sweep) ---
  # More paint-only / OS-shell / IO-watcher functions (same ADR-0007 rationale).
  '\bdraw_rotated_side_tabs\b',   # app/tab_strip_render.rs rotated side-tab paint
  '\bside_tab_bar_width\b',       # width from live ctx font measurement (no headless value)
  '\btab_hover_fill\b',           # painted hover colour
  '\bcompletion_popup\b',         # app/render_support.rs egui completion popup
  '\bspawn_config_watcher\b',     # notify::RecommendedWatcher filesystem-watch IO
  '\bread_clipboard_text\b',      # app/mod.rs OS clipboard (arboard)
  '\bwrite_clipboard_text\b',
  '\bopen_in_file_manager\b',     # OS shell
  '\bcopy_to_clipboard\b',        # issue_intake.rs OS clipboard
  '\bmc_push_undo_checkpoint\b',  # manipulates egui's live Undoer state, no pure observable
  # updater.rs powershell_runas_script is #[cfg(windows)]: cargo-mutants generates
  # its mutant from source, but on the ubuntu-latest mutation runner the fn is
  # never compiled, so no Linux test can kill it. Its exact output IS pinned by
  # the #[cfg(windows)] test powershell_runas_script_quotes_and_escapes_path.
  '\bpowershell_runas_script\b',
  # drain_crash_spool `-> ()` whole-fn: crash-report spool DISPATCH — Off is a
  # no-op (equivalent), Always calls auto_send_spooled_crashes which does a
  # network send_report (no test network), and AskEachTime loads into the private
  # CrashConsentState dialog queue (needs a Report spool fixture + private-field
  # observation). No clean headless observable for the whole-fn no-op (ADR-0007).
  'replace ScribeApp::drain_crash_spool with \(\)',
  # start_lsp_for_active guard `self.lsp.is_some() && self.lsp_lang == Some(lang)`:
  # the is_some() branch is UNREACHABLE-as-true headlessly — LspClient is only
  # constructed by `LspClient::spawn`, which launches a live LSP subprocess. The
  # `&&` short-circuits with lsp==None so the `==` never evaluates either.
  # ADR-0007 (requires a live OS process). Description-anchored: the old
  # ':1396:' anchor had rotated (the guard now sits ~110 lines lower) and was
  # matching nothing at all.
  'replace && with \|\| in ScribeApp::start_lsp_for_active',
  'replace == with != in ScribeApp::start_lsp_for_active',
  # egui TextFormat struct-field deletes: only change painted-glyph font/colour
  # (ADR-0007). These carry NO `in <fn>` suffix in the match string, so a
  # function-name token cannot catch them — match the field-delete shape.
  # eframe trait methods (clear_color/save/ui): live-frame/eframe-host only.
  '<impl eframe::App for ScribeApp>',

  # Traced EQUIVALENT mutants (unobservable). Every entry below is anchored on
  # the mutant DESCRIPTION printed by `cargo mutants --list`, or — where a bare
  # description would over-suppress a tested neighbour — on the mutant's COLUMN
  # with the LINE left as `\d+`. Neither form rotates when code above it moves.
  # See the "HOW TO ANCHOR A PARDON" header above before adding one.
  #
  # action_log record() -> process-global first-caller-wins OnceLock cache
  # (same argument as `path` / `log_outcome` above):
  'replace record with \(\)',
  # execute_builtin `active < len` guards (FoldAll AND SortLines): active is
  # invariantly clamped to len-1, so ==len is unreachable and the </==/>/<=
  # variants agree. One description covers BOTH occurrences, which is exactly
  # the union of the two anchors it replaces (':126:' FoldAll and ':147:27:'
  # SortLines) — a merge, not a widening. execute_builtin has no other `<`.
  'replace < with (==|>|<=) in ScribeApp::execute_builtin',
  # execute_builtin `... && !tab.doc.is_read_only_large()` (skip sort on a huge
  # read-only buffer): is_read_only_large is true ONLY for files >=
  # LARGE_FILE_THRESHOLD = 256 MiB, so for every unit-testable buffer it is
  # false and the `&&`/`||` branches are identical. Only a 256 MiB read-only
  # file (not unit-feasible) distinguishes them. Sole `&&` in the function.
  'replace && with \|\| in ScribeApp::execute_builtin',
  # edge_autoscroll_step over_bottom/over_top boundary: at depth 0 both the
  # original `>` and the mutated comparison end at t == 0.0 -> 0.0. These are
  # the function's only `>` comparisons, so the description covers exactly the
  # pair of lines the old ':189:'/':191:' anchors named (both had rotated —
  # ':189:' was pardoning an unrelated page_key_assist mutant).
  'replace > with (==|<|>=) in edge_autoscroll_step',
  # caret_edge_nudge boundary: at caret==limit both predicates fall through to
  # the same 0.0. Description-anchored; the old ':208:'/':210:' pair had rotated
  # onto a blank line and a doc comment.
  'replace < with <= in caret_edge_nudge',
  'replace > with >= in caret_edge_nudge',
  # apply_buffer_transform `active < len` (same len-1-clamp invariant as
  # execute_builtin) and its `&& !is_read_only_large()` guard (same 256 MiB
  # argument). Each is the only mutant of its shape in the function; the
  # `delete !` on the same line is deliberately NOT pardoned.
  'replace < with (==|>|<=) in ScribeApp::apply_buffer_transform',
  'replace && with \|\| in ScribeApp::apply_buffer_transform',
  # tab_index_after_move: idx==src is guarded before this expression, so the
  # comparison and the decrement are both unobservable there.
  'replace < with (==|>|<=) in tab_index_after_move',
  'replace - with (\+|/) in tab_index_after_move',
  'replace < with <= in ensure_readable_tone',  # bg_l<0.5 vs <=0.5 differ only at bg_l==0.5 exactly, unreachable from u8 channels (== and > ARE tested)
  # highlight_job tail-append is defensive: syntect spans always cover the full
  # line (byte==line.len()), so the tail branch never fires; the </>/==/&&->||
  # variants only toggle firing an EMPTY tail (no-op). `$`-anchored so it cannot
  # reach the nested `highlight_job::append_split` mutants, which stay gated
  # apart from the single one pardoned on its own merits below.
  'replace && with \|\| in highlight_job$',
  'replace < with (==|>|<=) in highlight_job$',
  'replace > with >= in highlight_job::append_split',  # None-branch next-boundary filter: a url starting AT pos would put pos INSIDE it (in_url=Some), so the None branch never sees st==pos -> `>` and `>=` are identical (== and < variants ARE killed)
  'replace match guard \*k == key with false in make_layouter',  # job-cache guard -> false = cache NEVER hits = always recompute highlight_job (deterministic, same output) = performance-equivalent (the 664 galley-cache correctness IS tested)
  'replace && with \|\| in ScribeApp::move_cursor_line',  # move_cursor_line trailing-"" drop: only text=="" distinguishes, then no-op
  # duplicate_cursor_line: `copy == lines[ln]`, so insert(ln+1,copy) and
  # insert(ln,copy) build element-wise identical vectors and join() the same.
  # Anchored on the mutant DESCRIPTION, not a line: the old ':418:' anchor
  # rotated onto a comment when a refactor moved the statement to 423, and the
  # mutant silently came back.
  'replace \+ with \* in ScribeApp::duplicate_cursor_line',
  'replace && with \|\| in ScribeApp::join_cursor_line_with_next',  # same trailing-"" equivalence
  'replace < with (==|>|<=) in changed_mask',  # changed_mask idx<n: new_index() in [0,n-1]; boundary unreachable
  # format_iso8601_utc else-branch is dead for all u64 secs (z>=719_468). The
  # `>=` is unique in the function; the `-` and `/` halves are COLUMN-pinned
  # because their bare descriptions also match the eight other arithmetic ops in
  # the same function, which ARE tested.
  'replace >= with < in format_iso8601_utc',
  'datetime\.rs:\d+:40: replace - with (\+|/) in format_iso8601_utc',
  'datetime\.rs:\d+:52: replace / with (%|\*) in format_iso8601_utc',
  # label_for_def trim disjunction redundant with the following split([...]).
  # All of label_for_def's mutants live in that one predicate, so the two
  # descriptions cover exactly what the old ':264:' line anchor did.
  'replace \|\| with && in label_for_def',
  'replace == with != in label_for_def',
  'replace \+ with (-|\*) in dir_children',  # dir_children depth+1: reachable only via 64-deep open CollapsingHeaders
  'filetree\.rs:\d+:54: replace == with != in dir_children',  # dir_children selected: only tints selectable_label (paint). COLUMN-pinned: the `==` pair earlier in the same fn IS tested.
  'find_in_files\.rs:\d+:28: replace \+= with (-=|\*=) in walk_project',  # walk_project files_seen: only observable at the 20_000-file cap. COLUMN-pinned: the other `+=` in the fn IS tested.
  'find_in_files\.rs:\d+:32: replace > with (==|<|>=) in walk_project',  # walk_project batch>remaining -> >=: truncate-to-equal is a no-op. COLUMN-pinned: the earlier `>` in the fn IS tested.
  'replace \|\| with && in walk_project',  # walk_project outer ||: the inner file-count cap backstops identical output. Sole `||` in the fn.
  'replace > with (==|<|>=) in title_tail_from',  # title_tail_from >80 -> >=: both branches equal at count==80
  # Re-anchored on the mutant DESCRIPTION after both line anchors rotated during
  # the markdown work (:279 slid onto `None => MdBlock::ListItem {`, :289 onto a
  # doc comment). A description anchor cannot rotate.
  'delete match arm Event::Start\(Tag::Heading\{\.\.\}\) in parse',   # runs always empty at a block Start (defensive)
  'delete match arm Event::Start\(Tag::Paragraph\) in parse',        # same
  # is_safe_link_scheme path-separator break: with `&&` the break never fires,
  # but the un-broken char is not a valid scheme char either, so the very next
  # arm breaks anyway. COLUMN-pinned to that predicate's three `||`: the bare
  # description also matches the whitespace/control strip and the dangerous-
  # scheme deny-list, both of which are real XSS logic that MUST stay gated.
  # The `==` variants on the same line are NOT pardoned (they would let
  # `javascript:` through, which the tests do catch). The old ':628:' anchor had
  # already rotated to matching nothing.
  'md_preview\.rs:\d+:(21|33|45): replace \|\| with && in is_safe_link_scheme',
  'replace < with (==|>|<=) in MultiCursor::apply_edit',  # apply_edit Delete head<total -> <=: EOF caret sorts last; shift never propagates
  # reconcile_carets !is_primary tiebreak: the retain-primary swap compensates.
  # The whole-fn replacements are named by the return type; the `!` half is
  # COLUMN-pinned because the other `delete !` in the same fn IS tested.
  'replace reconcile_carets -> Vec<\(Caret, bool\)> with ',
  'multi_cursor\.rs:\d+:69: delete ! in reconcile_carets',
  '''delete match arm Some\('\.'\) in is_unc_path''',  # is_unc_path: falls through to the identical `_ => true` arm. Quoted-char form kept so it cannot also match the sibling `Some('?')` arm, which IS tested.
  'replace > with (==|<|>=) in longest_backtick_run',  # longest_backtick_run > -> >=: idempotent longest=current when equal
  # session_persist content_sig loop: whether a NON-dirty tab (clean-saved or
  # empty-untitled) contributes to the change-detection hash. Including it (mutant)
  # can at most cause a SPURIOUS extra backup, never a MISSED one — a non-dirty
  # tab's content is stable, so real edits (a dirty tab) still change the sig
  # (pinned by backup_content_sig_tracks_a_dirty_tabs_edits, which kills the
  # sibling `||` on the same line). COLUMN-pinned: persist_session_and_autosave
  # carries four other `&&` / two other `delete !` mutants that ARE tested.
  'app/session_persist\.rs:\d+:64: replace && with \|\| in ScribeApp::persist_session_and_autosave',
  'app/session_persist\.rs:\d+:67: delete ! in ScribeApp::persist_session_and_autosave',
  # auto-save dirty filter `path.is_some() && is_dirty()` -> `||`: at most spuriously
  # saves a CLEAN file-backed tab (save_active rewrites identical bytes -> no
  # observable change) or attempts an untitled tab (no path -> save_active cannot
  # write). Neither is an observable correctness difference for the "flush dirty
  # FILE-BACKED buffers" contract (the sibling predicates ARE tested).
  'app/session_persist\.rs:\d+:68: replace && with \|\| in ScribeApp::persist_session_and_autosave',

  # --- Wave-2 pardons (survivor-anchored, deliberately NOT whole-function) ---
  #
  # Every entry below was cross-checked against the recovered CI survivor list
  # before it was written: it pardons ONLY mutants that were actually observed
  # MISSED. Where the wave-2 design proposed a whole-FUNCTION token, the token
  # was NARROWED to the observed survivors instead, because the measurement
  # said the broad form would have un-gated mutants the tests currently KILL —
  # `\brender_blocks\b` would have swallowed 13 of them, `\brender_runs_inner\b`
  # 9, `\brender_table\b` 4, and `\brender_notes_pane\b` 2 plus the one real,
  # killable gap at notes_ui.rs:506:75 that the design explicitly left open.
  # That is floor-lowering wearing a pardon's clothes, and this file's own
  # header forbids it: over-suppression is worse than rotation. Narrowing is a
  # TIGHTENING, not a widening — the same move the reporting.rs entry above
  # documents.
  #
  # tray.rs: `mod imp` is `#[cfg(windows)]` (tray.rs:195) and the mutation
  # runner is ubuntu-latest, so these are generated from SOURCE but never
  # compiled there — the same vacuous-MISSED condition ci.yml already excludes
  # integration/windows.rs for. No Linux test can kill them. Their real
  # coverage is `classify_menu` / `apply_toggle` / `toggle_from_ctx`, which are
  # NOT cfg-gated and ARE mutation-tested here. A pardon whose premise is a cfg
  # gate needs that premise pinned, so
  # `tray_imp_is_cfg_gated_so_the_mutation_pardon_stays_honest` (tray.rs) fails
  # the suite the moment the gate is removed — forcing these entries out rather
  # than letting them silently start hiding compiled, untested code.
  'tray\.rs.*\bimp::icon\b',
  'tray\.rs.*\bimp::init\b',
  # The OUTER `tray::init`'s `#[cfg(not(windows))]` body is `let _ = ctx;` — no
  # return value, no side effect — so `with ()` is provably equivalent on the
  # runner's target. Bounded to `with \(\)` deliberately, exactly like the
  # scribe-win32-chrome wrappers above.
  'replace tray::init with \(\)',
  # md_preview.rs table Start-arms: both clears are DEFENSIVE. `t.row` is
  # `mem::take`n at End(TableHead)/End(TableRow) and `runs` at End(TableCell),
  # so both buffers are already empty at every Start and deleting either arm is
  # byte-identical on any balanced pulldown-cmark stream. NOT argued from the
  # source alone: each arm was deleted locally (sha256 recorded before/after, so
  # the deletion provably landed) and all 84 md_preview tests stayed green.
  # NOTE: this rests on those three `mem::take`s. If any becomes a non-draining
  # read, DROP this pardon — the arms would start carrying state.
  'md_preview\.rs.*delete match arm Event::Start\(Tag::TableHead\)',
  'md_preview\.rs.*delete match arm Event::Start\(Tag::TableCell\)',
  # Paint-only siblings added by this PR — the same ADR-0007 egui-paint class as
  # `\bpaint_squiggle\b` above: the body is painter.rect_filled / line_segment /
  # text, the return is `()`, and nothing outside GPU pixels changes. Whole-
  # function tokens are used for exactly these two because EVERY mutant they
  # currently generate is a confirmed survivor (18/18 and 13/13), so the broad
  # form suppresses nothing that is killed today. The pure logic each one once
  # inlined is EXTRACTED and separately tested — `mark_lane`/`mark_y`/
  # `merge_marks` (overview_mark_tests) out of the first, `ws_marker`
  # (grid_methods_tests) out of the second — so neither pardon hides a logic gap.
  '\bpaint_overview_marks\b',
  '\bpaint_whitespace_markers\b',
  # paint_secondary_carets is the SAME class but gets survivor-anchored entries
  # rather than a whole-function token: 4 of its 10 current mutants
  # (`replace + with *` at two columns) were never observed MISSED, and 12 of
  # the 24 CI shards were cancelled at the 100-minute timeout, so "absent from
  # the survivor list" does NOT mean "caught" — it means UNKNOWN. Pardoning an
  # unknown is pardoning without evidence. Those four stay gated until a
  # complete run reports them; the six below were observed surviving.
  # (`same_galley_row` was lifted out of this body and IS tested.)
  'replace paint_secondary_carets with \(\)',
  'delete ! in paint_secondary_carets',
  'replace \+ with - in paint_secondary_carets',
  # md_preview.rs render_runs_inner: `\brender_runs\b` above CANNOT match it —
  # the next character is `_`, which IS a word character, so the boundary never
  # applies. The fix is a SECOND EXPLICIT ENTRY; never unbound `render_runs`,
  # which would silently re-widen every other `\b`-bounded token in this array.
  # The second entry is description-anchored rather than a bare
  # `\brender_runs_inner\b`, because 9 of that function's 16 mutants are killed
  # today (the `>` at :1217 and the `<` at :1230 families) and a whole-function
  # token would un-gate all nine. These two descriptions cover the fn's only
  # `||` and its only three `&&`, i.e. exactly 4 of its 7 survivors. The three
  # surviving `delete !` on the same line are deliberately NOT pardoned: their
  # description and their columns both collide with the killed `delete !` at
  # :1201/:1203, and there is no anchor that separates them without
  # over-suppressing. They stay honestly red.
  'replace \|\| with && in render_runs_inner',
  'replace && with \|\| in render_runs_inner',
  # md_preview.rs render_blocks / render_table: one survivor each, both inside
  # egui Grid/indent emission. Description-anchored to that single survivor —
  # the sibling operators at the SAME line and column (`< with ==`/`< with >`,
