  'replace < with <= in render_blocks',
  'replace \+= with \*= in render_table',
  # notes_ui.rs tag-tree indent: `node.depth as f32 * TAG_TREE_INDENT` feeds
  # `ui.add_space` only (painted pixels). These are the function's ONLY `*`
  # mutants, so the description cannot reach anything else — in particular it
  # does NOT touch `notes_ui.rs:506:75` (`selected_tag == node.tag`), which
  # drives `selectable_label` and is a REAL, killable gap awaiting an
  # egui_kittest fixture. Pardoning that one by using a whole-function token
  # here would have hidden it.
  'replace \* with (\+|/) in ScribeApp::render_notes_pane',

