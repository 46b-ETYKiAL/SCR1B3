# PR-time supply-chain gate. Blocks a pull request that INTRODUCES a dependency
# carrying a known (GHSA) vulnerability at/above `fail-on-severity`, BEFORE it
# lands — a gate the whole-tree cargo-deny/cargo-audit CI cannot give (they run
# after merge / on the full tree, not as a diff gate on the PR).
#
# Complements — does not replace — cargo-deny (deny.toml), which stays the
# authoritative advisory + license gate over the entire dependency tree.
# License checking is deliberately OFF here: GitHub's dependency-graph SPDX
# metadata for Cargo crates is incomplete and produces false "unknown license"
# failures, so deny.toml owns licenses and this action owns the PR vuln-diff.
#
# GitHub's dependency graph parses Cargo.lock, so this works on the Rust tree.
name: Dependency Review

on:
  pull_request:
    branches: [master]

# Least-privilege default; the job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: dep-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment-summary-in-pr (no-ops on fork PRs; the gate still runs)
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # Block-mode egress firewall. With `show-openssf-scorecard: false`
          # below, dependency-review-action reaches ONLY the GitHub
          # dependency-graph API; checkout reaches github.com.
          #
          # This comment used to assert that unconditionally, and it was wrong
          # in a way that cost a red gate: the action's scorecard feature is ON
          # by default and calls api.deps.dev and api.securityscorecards.dev,
          # both of which this allowlist blocks at the OS. The failure surfaced
          # as an undici "fetch failed" — NOT as the checkout or merge-ref
          # error it reads like — and only on PRs that actually change a
          # dependency manifest, because a PR with no manifest change performs
          # zero scorecard lookups. The first head to touch Cargo.lock was the
          # first to go red. Turning the feature off is what makes this
          # allowlist honest; do not widen it back without re-enabling the
          # feature that needs it.
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # deny.toml is the authoritative license gate — see header.
          license-check: false
          # OFF, and load-bearing rather than a preference: this input DEFAULTS
          # TO TRUE, and the scorecard lookup calls api.deps.dev +
          # api.securityscorecards.dev, which the harden-runner egress block
          # above denies. Left on, every PR that changes Cargo.lock fails the
          # gate on a network error that looks nothing like its cause. The
          # OpenSSF signal is also not what this gate is FOR — it is a PR-time
          # vulnerability diff, and cargo-deny/deny.toml remains the
          # authoritative supply-chain gate over the whole tree.
          show-openssf-scorecard: false
          comment-summary-in-pr: on-failure
