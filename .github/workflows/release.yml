name: Release

# Tag-gated cross-OS release: builds signed, checksummed artifacts and attaches
# them to a GitHub Release. Signing keys are provided as repo secrets and are
# NEVER committed (see packaging/signing.md). The in-app updater verifies the
# minisign signature against the embedded public key before swapping.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least-privilege default. Only the `release` job (which creates the GitHub
# Release) is granted `contents: write`; the build matrix is read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------------------
  # License-delivery gate. Runs BEFORE anything is built so a release can never
  # publish an artifact that omits the license texts it is legally required to
  # carry. The shipped binary embeds 22 OFL-1.1 / Apache-2.0 typefaces plus a
  # third-party word list; OFL-1.1 s2 requires the license to accompany every
  # copy, and until this gate existed the primary .tar.gz held only the binary.
  #
  # This asserts over the packaging manifest (this workflow) and the repo tree
  # -- it builds nothing, so it is seconds, not minutes. Every build job gates
  # on it via `needs:`.
  # --------------------------------------------------------------------------
  license-delivery:
    name: License delivery (fonts must ship their licenses)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --user --disable-pip-version-check pyyaml
      - name: Verify every artifact path stages its license texts
        run: python3 packaging/verify_license_delivery.py
      - name: Verify the collector itself produces a complete license set
        run: |
          set -euo pipefail
          sh packaging/collect-licenses.sh "${PWD}" /tmp/license-probe
          echo "--- staged tree ---"
          find /tmp/license-probe -type f | sort
          n=$(find /tmp/license-probe/licenses/fonts -type f | wc -l)
          [ "$n" -gt 0 ] || { echo "::error::no font licenses staged"; exit 1; }
          test -s /tmp/license-probe/licenses/dictionaries/en_US-PROVENANCE.txt
          echo "font license files staged: $n"

  build:
    needs: license-delivery
    name: build ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS. SCR1B3 previously shipped NO x86_64 macOS build at all,
          # so every Intel Mac was unserved — `packaging/install.sh` resolves
          # `scr1b3-x86_64-apple-darwin.tar.gz` on such a host and 404'd, and the
          # in-app updater reported "no build for your platform". It is
          # CROSS-BUILT on the Apple-Silicon runner via the universal Apple
          # toolchain (rustup adds the target; Apple's clang emits a native
          # x86_64 Mach-O) rather than on the scarce, queue-starved `macos-13`
          # Intel runner. This is the identical mechanism the sibling C0PL4ND
          # release matrix already uses for this exact triple.
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          # Pinned for reproducible release builds; bump with rust-toolchain.toml.
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libssl-dev
      # Embed the REAL release public key (a PUBLIC value, safe in a repo var)
      # so the shipped binary's in-app updater can verify signed releases.
      # Without the var set, the fail-closed placeholder in verify.rs stays and
      # auto-update verification rejects every artifact (never accepts an
      # unsigned/forged update) — see packaging/signing.md.
      - name: Embed release public key (when provisioned)
        if: vars.SCR1B3_MINISIGN_PUBLIC_KEY != ''
        shell: bash
        env:
          PUBKEY: ${{ vars.SCR1B3_MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          python - "$PUBKEY" <<'PY'
          import re, sys, pathlib
          # The pubkey box form is two lines; keep the newline as a Rust \n escape.
          pk = sys.argv[1].replace("\r\n", "\n").replace("\n", "\\n").replace('"', '\\"')
          p = pathlib.Path("crates/scribe-core/src/update/verify.rs")
          s = p.read_text(encoding="utf-8")
          pat = re.compile(r'pub const EMBEDDED_PUBLIC_KEY: &str = "[^"]*";')
          new = pat.sub(lambda _m: f'pub const EMBEDDED_PUBLIC_KEY: &str = "{pk}";', s, count=1)
          assert new != s and "RWQ0000" not in new, "pubkey placeholder was not replaced"
          p.write_text(new, encoding="utf-8")
          print("embedded release public key")
          PY
      # No dependency cache in the release build: a poisoned cache could taint
      # published, signed artifacts (zizmor cache-poisoning). Release builds are
      # clean + reproducible by design.
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked
      - name: Build release (cargo-auditable + hardened RUSTFLAGS)
        shell: bash
        env:
          MATRIX_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          # `cargo auditable build` embeds a scannable SBOM (the exact dependency
          # list + versions) into a section of the shipped binary, so the EXACT
          # artifact users run can be vuln-scanned offline with `cargo audit bin`,
          # trivy, grype, or osv-scanner — closing the gap that the release-time
          # CycloneDX SBOM is a detached file.
          #
          # An env RUSTFLAGS REPLACES `.cargo/config.toml`'s rustflags wholesale,
          # so we re-state Control Flow Guard here (Windows) and additionally strip
          # the build-machine absolute paths (workspace + cargo home) from the
          # binary via `--remap-path-prefix` (cleaner, more deterministic output;
          # the residual paths are the public CI runner's, not a user's).
          flags="--remap-path-prefix=${GITHUB_WORKSPACE}=/scr1b3 --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          if [ "$MATRIX_OS" = "Windows" ]; then
            flags="-C control-flow-guard $flags"
          fi
          export RUSTFLAGS="$flags"
          cargo auditable build --release --locked --target ${{ matrix.target }}
      - name: Generate third-party license inventory (cargo-about)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # cargo-about generates a single HTML page with the license text of
          # every transitive Cargo dependency, satisfying the Apache-2.0
          # NOTICE-file convention and the OFL/UFL §3 redistribution clause for
          # the bundled fonts. Generated only on Linux because output is
          # platform-independent (avoids 3× redundant runs).
          set -euo pipefail
          # No error swallowing. This step previously ran
          #   cargo about init --no-handlebars 2>/dev/null || true
          #   cargo about generate about.hbs ... 2>/dev/null || ... || echo "skipped"
          # with `about.hbs` never committed, so it ALWAYS failed, the failure
          # was hidden, and no inventory was ever published -- while
          # THIRD-PARTY-LICENSES.md told readers one was generated at release
          # time. The template now lives at packaging/about.hbs (tracked) and
          # any failure here fails the release, which is the correct behaviour
          # for a legal-compliance artifact.
          cargo install cargo-about --locked --version "^0.6"
          cargo about generate packaging/about.hbs \
            --output-file THIRD-PARTY-LICENSES-RUST.html
          # A zero-byte file would upload "successfully" and satisfy nobody.
          [ -s THIRD-PARTY-LICENSES-RUST.html ] \
            || { echo "::error::cargo-about produced an empty inventory"; exit 1; }
          echo "generated THIRD-PARTY-LICENSES-RUST.html ($(wc -c < THIRD-PARTY-LICENSES-RUST.html) bytes)"
      - name: Upload third-party license inventory
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses-rust
          path: THIRD-PARTY-LICENSES-RUST.html
          # `warn` would let a missing inventory pass silently -- the exact
          # failure mode this change exists to remove. The `release` job
          # publishes every downloaded artifact, so this file becomes a release
          # asset; if it is absent, the release is incomplete and must fail.
          if-no-files-found: error
      - name: Package + checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="scr1b3"
          [ "${{ runner.os }}" = "Windows" ] && bin="scr1b3.exe"

          # Assemble the archive contents in a staging dir OUTSIDE `dist/`.
          # `dist/*` is uploaded verbatim as the job's artifact, so staging in
          # place would publish loose LICENSE/licenses/ files as stray release
          # assets. The staging dir keeps `dist/` to exactly the two intended
          # assets: the tarball and its .sha256 sidecar.
          stage=pkg-stage
          rm -rf "$stage"; mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/$bin" "$stage/"

          # License delivery is MANDATORY. The binary embeds 22 OFL-1.1 /
          # Apache-2.0 typefaces plus a third-party word list; OFL-1.1 s2
          # requires the license text to accompany every copy. This tarball
          # previously contained ONLY the binary -- not even LICENSE-MIT.
          # The collector exits non-zero (failing the job) if any license is
          # missing, so an unlicensed archive can never be produced.
          sh packaging/collect-licenses.sh "${PWD}" "$stage"

          # Explicit member list: the binary stays at the archive root (the
          # .deb / AppImage / .app jobs extract it by bare name), and the
          # license tree rides alongside it. Naming members explicitly means a
          # future edit cannot silently drop the licenses.
          tar -czf "dist/scr1b3-${{ matrix.target }}.tar.gz" -C "$stage" \
            "$bin" LICENSE-MIT THIRD-PARTY-LICENSES.md licenses
          echo "--- archive contents ---"
          tar -tzf "dist/scr1b3-${{ matrix.target }}.tar.gz"

          cd dist
          # The checksum sidecar MUST be named `<asset>.sha256` —
          # `scr1b3-<target>.tar.gz.sha256` — because the `release` job
          # concatenates every one of these into the single published
          # `SHA256SUMS` manifest, and each line's filename field must be the
          # exact published asset name. (The per-artifact `.sha256` itself is
          # pruned before upload; it is a build-internal intermediate now.)
          #
          # This was previously
          #   if command -v sha256sum >/dev/null; then ... 2>/dev/null || true; fi
          # — a DOUBLE silent-skip: stock macOS ships `shasum`, not `sha256sum`,
          # so on the macOS leg the guard was false and the checksum was skipped
          # with no error, and even on Linux a failure was swallowed by
          # `|| true`. A skipped checksum silently dropped that platform's line
          # from SHA256SUMS, and `packaging/install.sh` refuses to install an
          # asset it cannot find a checksum for. Handle BOTH tool names and fail
          # LOUDLY when neither exists.
          if command -v sha256sum >/dev/null 2>&1; then
            SHACMD="sha256sum"
          elif command -v shasum >/dev/null 2>&1; then
            SHACMD="shasum -a 256"
          else
            echo "::error::no sha256 tool on this runner (need sha256sum or shasum) — refusing to publish an unchecksummed artifact"
            exit 1
          fi
          tgz="scr1b3-${{ matrix.target }}.tar.gz"
          $SHACMD "$tgz" > "$tgz.sha256"
          # A zero-byte sidecar would satisfy `[ -f ]` downstream and produce an
          # empty SHA256SUMS line. Assert real content.
          [ -s "$tgz.sha256" ] || { echo "::error::checksum for $tgz is empty"; exit 1; }
          cat "$tgz.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scr1b3-${{ matrix.target }}
          # Artifacts are built into `dist/` at the repo root (this is the
          # standalone public repo — NOT the monorepo `apps/scribe/` subtree).
          path: dist/*
          if-no-files-found: error

  windows-installer:
    # Builds the native Itasha.Corp CRT installer (.exe) — the same branded
    # FORGE-WIRE installer C0PL4ND ships, NOT a stock NSIS/MSI. The framework
    # (F0RG3-W1R3) owns the installer crate + branding; this job feeds it the
    # compiled scr1b3.exe + assets and the per-app config (apps/scribe.toml,
    # incl. the [itasha.brand] voice/kanji/tagline). Output:
    # scr1b3-<tag>-x86_64-setup.exe.
    name: Windows installer (native CRT)
    needs: build
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    permissions:
      contents: read
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout SCR1B3 (assets + licenses)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: app
          persist-credentials: false
      - name: Checkout installer framework (F0RG3-W1R3)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: 46b-ETYKiAL/Itasha.Corp_F0RG3-W1R3
          path: framework
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          # Pinned for reproducible release builds; bump with rust-toolchain.toml.
          toolchain: "1.95.0"
      - name: Download Windows binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scr1b3-x86_64-pc-windows-msvc
          path: winbin
      - name: Assemble payload (binary + assets + licenses)
        shell: bash
        run: |
          set -euo pipefail
          tgz="$(find winbin -name '*.tar.gz' | head -1)"
          [ -n "$tgz" ] || { echo "::error::no windows tarball under winbin/"; exit 1; }
          mkdir -p payload
          tar -xzf "$tgz" -C payload
          [ -f payload/scr1b3.exe ] || { echo "::error::scr1b3.exe not found in tarball"; exit 1; }
          if [ -d app/assets ]; then cp -r app/assets payload/assets; fi
          # License delivery is MANDATORY, not the previous best-effort
          # `[ -f … ] && cp … || true` (which silently shipped nothing when a
          # file was absent, and never carried a single font license text).
          # The collector fails the job if any bundled font's license is
          # missing — OFL-1.1 s2 requires it to accompany every copy.
          sh app/packaging/collect-licenses.sh app payload
          find payload -maxdepth 2 | head -40
          echo "font license files in payload: $(find payload/licenses/fonts -type f | wc -l)"
      - name: Build native installer (.exe)
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Sanitise the ref for use in a filename: a real release tag (v0.4.47)
          # is unchanged; a workflow_dispatch validation run carries the branch
          # name (which may contain a `/`) — without this the `.exe` would land
          # in a `dist/<branch>/` subdir and the checksum glob would miss it.
          TAG="${REF_NAME//\//-}"
          python framework/scripts/build_native_installer.py \
            --app scribe \
            --binary-dir payload \
            --version "$TAG" \
            --out "dist/scr1b3-${TAG}-x86_64-setup.exe"
          ls -la dist
      - name: Checksum installer
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for e in *.exe; do sha256sum "$e" > "$e.sha256"; done
          cat *.sha256
      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scr1b3-windows-installer
          path: dist/*
          if-no-files-found: error

  windows-msi:
    # The MSI. `crates/scribe-app/wix/main.wxs` was already compiled, ICE-validated
    # and dark-verified by ci.yml's `msi-build` job — but ONLY there, so the
    # package was built, proven and then thrown away: release.yml had no MSI step
    # and no release has ever carried one. This job publishes it.
    #
    # It CONSUMES the `build` job's artifact instead of rebuilding, which is the
    # one decision here that matters. ci.yml's job runs its own `cargo build`
    # because it is a compile-check with no release artifact in scope; a release
    # MUST NOT do that, because the `build` job's binary is not reproducible from
    # a plain `cargo build`:
    #   * `Embed release public key` patches the REAL minisign pubkey into
    #     verify.rs before compiling. A freshly-built exe keeps the fail-closed
    #     placeholder, so an MSI-installed SCR1B3 would reject EVERY update it is
    #     ever offered — a silent, permanent auto-update outage for MSI users only.
    #   * `cargo auditable` embeds the scannable dependency SBOM.
    #   * Windows RUSTFLAGS add `-C control-flow-guard` plus --remap-path-prefix.
    # Rebuilding would ship an exe that is unsigned-key, un-auditable and
    # un-hardened relative to the .tar.gz of the same release. So: same bytes,
    # one build, three wrappers (tar.gz, native CRT .exe, .msi).
    name: Windows installer (.msi)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # WiX 3.x is required (main.wxs uses the wix/2006/wi namespace, which WiX
      # 4/5 do not accept). Pinned to a release asset + SHA-256 rather than
      # relying on whatever the runner image happens to preinstall, so a runner
      # image change cannot silently swap the compiler under the gate. Kept
      # byte-identical to ci.yml's msi-build job — if one moves, move both.
      WIX_URL: "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
      WIX_SHA256: "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31"
      REGISTRY_ROW_FLOOR: "300"
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download Windows binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scr1b3-x86_64-pc-windows-msvc
          path: winbin
      - name: Assemble payload (binary + licenses)
        shell: bash
        # License delivery is MANDATORY here for exactly the reason it is in the
        # native-CRT installer job. SCR1B3 include_bytes!-embeds 22 typefaces
        # (21 OFL-1.1 + Syncopate Apache-2.0) and include_str!-embeds a word
        # list; OFL-1.1 s2 requires the license text to accompany EVERY copy,
        # and a font compiled into the .exe cannot serve its own license. The
        # MSI previously carried ONE file - scr1b3.exe - so an MSI install put
        # 22 fonts on disk with the license text nowhere. That is the same
        # breach the .deb/.AppImage/.dmg once had.
        #
        # The collector exits non-zero (failing the job) when any bundled font
        # has no license text, so an unlicensed MSI cannot be produced. It is
        # staged into its OWN directory rather than into payload/ so `heat` can
        # harvest the license tree without also re-harvesting scr1b3.exe, which
        # main.wxs already declares.
        run: |
          set -euo pipefail
          tgz="$(find winbin -name '*.tar.gz' | head -1)"
          [ -n "$tgz" ] || { echo "::error::no windows tarball under winbin/"; exit 1; }
          mkdir -p payload
          tar -xzf "$tgz" -C payload
          [ -f payload/scr1b3.exe ] || { echo "::error::scr1b3.exe not found in tarball"; exit 1; }
          ls -la payload/scr1b3.exe
          sh packaging/collect-licenses.sh "${PWD}" licstage
          n=$(find licstage/licenses/fonts -type f | wc -l)
          echo "font license files staged: $n"
          [ "$n" -gt 0 ] || { echo "::error::no font licenses staged"; exit 1; }
      - name: Install WiX 3.14 (pinned + checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLf -o wix314-binaries.zip "$WIX_URL"
          # Verify BEFORE extracting: an unverified archive is never unpacked.
          echo "${WIX_SHA256}  wix314-binaries.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wix"
          if command -v unzip >/dev/null 2>&1; then
            unzip -q -o wix314-binaries.zip -d "$RUNNER_TEMP/wix"
          elif command -v 7z >/dev/null 2>&1; then
            7z x -y -o"$RUNNER_TEMP/wix" wix314-binaries.zip > /dev/null
          else
            echo "::error::no archive extractor available (tried unzip, 7z)"
            exit 1
          fi
          for t in candle.exe light.exe dark.exe heat.exe; do
            [ -f "$RUNNER_TEMP/wix/$t" ] || { echo "::error::WiX archive did not contain $t"; exit 1; }
          done
      - name: Compile the installer source (candle)
        shell: bash
        run: |
          set -euo pipefail
          # No Rust toolchain in this job (it builds nothing), so the version comes
          # from Cargo.toml the same way the macOS installer job reads it. The
          # workspace root carries the real number and scribe-app inherits it via
          # `version.workspace = true`.
          VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          # WiX requires x.x.x.x with each field <= 65534, so a non-numeric or
          # empty version must stop here rather than reach candle as garbage.
          echo "$VER" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$' \
            || { echo "::error::could not resolve a numeric version (got '$VER')"; exit 1; }
          echo "installer version = $VER"
          BIN_DIR="$(pwd -W)/payload"
          LIC_DIR="$(pwd -W)/licstage"
          # Harvest the staged license tree into a WiX fragment. Generated,
          # not hand-authored: a hand-written list of 22 font directories
          # rots the moment a font is added or dropped, and the whole point
          # of the collector is that the set is dynamic. The XSL adds the
          # RemoveFolder rows heat never emits -- without them `light` fails
          # with one LGHT0204/ICE64 per harvested directory, because SCR1B3
          # installs into the user profile. Authoring the rows keeps ICE64
          # ENFORCED instead of suppressing it -- the same trade main.wxs
          # already documents for APPLICATIONFOLDER / ProgramsFolder.
          "$RUNNER_TEMP/wix/heat.exe" dir "$LIC_DIR" -nologo \
            -cg LicenseComponents -dr APPLICATIONFOLDER \
            -ag -srd -sfrag -var var.LicenseStageDir \
            -t crates/scribe-app/wix/license-harvest.xsl \
            -out licenses.wxs
          # Non-vacuity: a harvest that produced nothing would compile and
          # link perfectly and ship an MSI with no license texts at all --
          # the exact silent under-delivery this step exists to prevent.
          harvested=$(grep -c '<File ' licenses.wxs || true)
          echo "harvested license files: $harvested"
          [ "$harvested" -ge 25 ] || { echo "::error::heat harvested only $harvested license file(s); expected >= 25 (22 fonts + top-level docs)"; exit 1; }
          "$RUNNER_TEMP/wix/candle.exe" -nologo -arch x64 \
            -dVersion="$VER" -dCargoTargetBinDir="$BIN_DIR" -dLicenseStageDir="$LIC_DIR" \
            -out main.wixobj crates/scribe-app/wix/main.wxs
          [ -s main.wixobj ] || { echo "::error::candle reported success but produced no .wixobj"; exit 1; }
          "$RUNNER_TEMP/wix/candle.exe" -nologo -arch x64 \
            -dLicenseStageDir="$LIC_DIR" \
            -out licenses.wixobj licenses.wxs
          [ -s licenses.wixobj ] || { echo "::error::candle produced no .wixobj for the license fragment"; exit 1; }
      - name: Link the installer (light, with ICE validation)
        shell: bash
        # ICE validation stays ON, and exactly the same two ICEs are suppressed
        # as in ci.yml's msi-build job — see that job for the full rationale.
        # Both suppressions were re-confirmed empirically, not assumed:
        #   * with NO -sice flags, light exits 204 on ICE38 (load-bearing);
        #   * with only ICE38 suppressed, ICE91 is warning LGHT1076 and light
        #     exits 0 (kept for intent/-wx safety, not because it is needed);
        #   * ICE64 does not appear at all — main.wxs's RemoveFolder rows resolve
        #     it, so it stays ENFORCED rather than suppressed.
        # Do NOT widen this list to make an edit pass.
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wix/light.exe" -nologo \
            -ext WixUIExtension -ext WixUtilExtension \
            -sice:ICE38 -sice:ICE91 \
            -out scr1b3-installer.msi main.wixobj licenses.wixobj
          [ -f scr1b3-installer.msi ] || { echo "::error::light reported success but produced no .msi"; exit 1; }
          sz=$(wc -c < scr1b3-installer.msi)
          echo "MSI size = $sz bytes"
          [ "$sz" -gt 100000 ] || { echo "::error::MSI is implausibly small ($sz bytes)"; exit 1; }
      - name: Assert the compiled MSI carries the registry table the app expects
        shell: bash
        # Same read-it-back-out-of-the-package assertion ci.yml makes, kept here
        # so the artifact that is actually PUBLISHED is the one verified.
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wix/dark.exe" -nologo scr1b3-installer.msi -out decompiled.wxs
          [ -s decompiled.wxs ] || { echo "::error::dark produced no output"; exit 1; }
          built=$(grep -c '<RegistryValue' decompiled.wxs || true)
          src=$(grep -c '<RegistryValue' crates/scribe-app/wix/main.wxs || true)
          echo "RegistryValue rows: source=$src compiled=$built"
          if [ "$built" -lt "$REGISTRY_ROW_FLOOR" ]; then
            echo "::error::the compiled MSI carries only $built RegistryValue rows (floor $REGISTRY_ROW_FLOOR) -- the registry table did not make it into the package."
            exit 1
          fi
          # Written as `[ good ] || { fail; }`, matching the licfiles check
          # below, NOT as `if [ bad ]; then fail; fi`. `src` comes from a
          # `grep -c ... || true` over a path this step never asserts exists,
          # so it can be empty. `[ 350 -ne "" ]` exits 2 ("integer expression
          # expected"), `if` reads 2 as false, and `set -e` does not fire on a
          # failing `if` CONDITION -- so the bad-condition form silently
          # skipped its own then-branch and the check no-opped. The `||` form
          # treats 2 as "not true" and fails closed on the same input.
          [ "$built" -eq "$src" ] || {
            echo "::error::registry rows differ between source ($src) and compiled MSI ($built) -- rows were dropped or merged during the build, or main.wxs could not be read."
            exit 1
          }
          # License delivery, asserted against the BUILT package rather than
          # the staging directory. A staged tree only proves the collector
          # ran; the File table is what proves the texts actually SHIP. The
          # MSI carried exactly one File row (scr1b3.exe) before the license
          # components existed, so this is the check that would have caught
          # it.
          licfiles=$(grep -cE '<File [^>]*Name="(OFL|LICENSE|UFL)[^"]*"' decompiled.wxs || true)
          echo "license files in the compiled MSI: $licfiles"
          [ "$licfiles" -ge 22 ] || { echo "::error::the compiled MSI carries only $licfiles font license file(s) (expected >= 22) -- OFL-1.1 s2 requires the text to accompany every copy."; exit 1; }
          for doc in LICENSE-MIT THIRD-PARTY-LICENSES.md; do
            grep -q "Name=\"$doc\"" decompiled.wxs || { echo "::error::the compiled MSI does not carry $doc"; exit 1; }
          done
      - name: Name + checksum the release asset
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${REF_NAME//\//-}"
          mv scr1b3-installer.msi "dist/scr1b3-${TAG}-x86_64.msi"
          cd dist
          # Unconditional, exactly like the native-CRT installer job above. This
          # deliberately does NOT copy the `build` job's
          # `if command -v sha256sum >/dev/null; then ... || true; fi` form: that
          # guard silently skips the checksum on any runner without sha256sum,
          # and a missing .sha256 makes packaging/install.sh refuse to install.
          # This job only ever runs on windows-latest, where Git-Bash always
          # provides sha256sum, so a failure here is a real failure.
          for m in *.msi; do sha256sum "$m" > "$m.sha256"; done
          ls -la; cat *.sha256
      - name: Upload MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scr1b3-windows-msi
          path: dist/*
          if-no-files-found: error

  linux-installers:
    # Builds the two first-install Linux artifacts from the SAME compiled binary
    # the `build` job produced: a Debian package (.deb) and a portable AppImage.
    # These are NOT auto-update targets — the in-app updater swaps the binary in
    # place via the signed latest.json manifest, which lists only the .tar.gz /
    # .exe archives. They are for first install. The `release` job's sign loop +
    # fail-closed self-verify gate sign and verify them like every other asset.
    name: Linux installers (.deb + AppImage)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout SCR1B3 (packaging + assets)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: app
          persist-credentials: false
      - name: Download Linux binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scr1b3-x86_64-unknown-linux-gnu
          path: linbin
      - name: Build .deb (dpkg-deb) + AppImage (appimagetool, pinned)
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Asset-name tag: the release tag on a tag push (v0.4.47); a sanitised
          # branch name on a workflow_dispatch validation run (the `release` job
          # is tag-gated and won't publish those). The .deb Version field +
          # Info.plist need a clean semver, so derive that from the workspace
          # Cargo.toml — valid for both trigger types.
          TAG="${REF_NAME//\//-}"
          VER="$(grep -m1 '^version' app/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          tgz="$(find linbin -name '*.tar.gz' | head -1)"
          [ -n "$tgz" ] || { echo "::error::no linux tarball under linbin/"; exit 1; }
          mkdir -p dist

          # ---- .deb (dpkg-deb, preinstalled on ubuntu-latest) ----------------
          deb=stage-deb
          rm -rf "$deb"
          mkdir -p "$deb/usr/bin" "$deb/usr/share/applications" \
                   "$deb/usr/share/icons/hicolor" "$deb/DEBIAN"
          # Extract ONLY the binary: the tarball also carries the license tree,
          # which belongs in /usr/share/doc, not /usr/bin.
          tar -xzf "$tgz" -C "$deb/usr/bin" scr1b3
          [ -f "$deb/usr/bin/scr1b3" ] || { echo "::error::scr1b3 not in tarball"; exit 1; }
          chmod 0755 "$deb/usr/bin/scr1b3"
          # License texts at the Debian-standard location. Mandatory: the
          # collector fails the job if any bundled font's license is missing
          # (OFL-1.1 s2 — the license must accompany every copy).
          mkdir -p "$deb/usr/share/doc/scr1b3"
          sh app/packaging/collect-licenses.sh app "$deb/usr/share/doc/scr1b3"
          install -m0644 app/packaging/linux/scr1b3.desktop "$deb/usr/share/applications/scr1b3.desktop"
          cp -r app/assets/icons/hicolor/. "$deb/usr/share/icons/hicolor/"
          # Control file: reuse the committed template, substitute the real
          # version, and append the computed Installed-Size (KiB of /usr).
          size_kb="$(du -ks "$deb/usr" | cut -f1)"
          sed -E "s/^Version: .*/Version: ${VER}/" app/packaging/linux/debian-control > "$deb/DEBIAN/control"
          printf 'Installed-Size: %s\n' "$size_kb" >> "$deb/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$deb" "dist/scr1b3-${TAG}-amd64.deb"
          echo "----- .deb info -----"; dpkg-deb --info "dist/scr1b3-${TAG}-amd64.deb"
          # Full listing (no `| head`: under `set -o pipefail` an early-closing
          # head gives dpkg-deb's internal tar an EPIPE and fails the step).
          echo "----- .deb contents -----"; dpkg-deb --contents "dist/scr1b3-${TAG}-amd64.deb"
          # Best-effort lint (style nits must not fail a release).
          command -v desktop-file-validate >/dev/null && \
            desktop-file-validate "$deb/usr/share/applications/scr1b3.desktop" || true

          # ---- AppImage (appimagetool 1.9.1, pinned + sha256-verified) -------
          appdir=AppDir
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor"
          # Extract ONLY the binary (see the .deb note above).
          tar -xzf "$tgz" -C "$appdir/usr/bin" scr1b3
          chmod 0755 "$appdir/usr/bin/scr1b3"
          # License texts inside the AppImage (OFL-1.1 s2). Mandatory.
          mkdir -p "$appdir/usr/share/doc/scr1b3"
          sh app/packaging/collect-licenses.sh app "$appdir/usr/share/doc/scr1b3"
          install -m0644 app/packaging/linux/scr1b3.desktop "$appdir/usr/share/applications/scr1b3.desktop"
          install -m0644 app/packaging/linux/scr1b3.desktop "$appdir/scr1b3.desktop"            # top-level (required)
          cp -r app/assets/icons/hicolor/. "$appdir/usr/share/icons/hicolor/"
          install -m0644 app/assets/icons/hicolor/256x256/apps/scr1b3.png "$appdir/scr1b3.png"  # top-level icon
          # AppRun via printf (NOT a heredoc — a YAML-indented heredoc would inject
          # leading spaces into the `#!` shebang line and break it).
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/scr1b3" "$@"\n' > "$appdir/AppRun"
          chmod 0755 "$appdir/AppRun"
          # Pinned, immutable appimagetool release + digest (supply-chain: no
          # rolling `continuous` tag; sha256 verified before exec).
          AIT_URL="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          AIT_SHA="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          curl -fsSL --retry 3 -o appimagetool "$AIT_URL"
          echo "${AIT_SHA}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          # `--appimage-extract-and-run` avoids needing FUSE on the CI runner.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" "dist/SCR1B3-${TAG}-x86_64.AppImage"

          # ---- checksums (sidecars the release self-verify gate's digest check reads) ----
          cd dist
          for f in *.deb *.AppImage; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
          ls -la; cat *.sha256
      - name: Upload Linux installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scr1b3-linux-installers
          path: dist/*
          if-no-files-found: error

  macos-installer:
    # Builds the macOS first-install artifacts from the compiled binary: a proper
    # SCR1B3.app bundle and a compressed .dmg. First-install only (not an
    # auto-update target). The .icns is generated on the runner from the 1024px
    # master PNG via iconutil (preinstalled) — no committed binary icon.
    #
    # Matrixed over BOTH macOS arches. It previously produced an aarch64 .dmg
    # only, so an Intel Mac user had no installer at all; the Intel leg consumes
    # the x86_64-apple-darwin tarball the build matrix now produces. Per-arch
    # .dmg (rather than one `lipo` universal bundle) keeps the naming aligned
    # with the tarballs and keeps each leg independently reproducible.
    name: macOS installer (.app + .dmg, ${{ matrix.arch }})
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    permissions:
      contents: read
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout SCR1B3 (packaging + assets)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: app
          persist-credentials: false
      - name: Download macOS binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scr1b3-${{ matrix.target }}
          path: macbin
      - name: Build .app bundle + .dmg
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${REF_NAME//\//-}"
          VER="$(grep -m1 '^version' app/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          tgz="$(find macbin -name '*.tar.gz' | head -1)"
          [ -n "$tgz" ] || { echo "::error::no macOS tarball under macbin/"; exit 1; }
          mkdir -p dist

          # ---- SCR1B3.app bundle ---------------------------------------------
          appbundle="SCR1B3.app"
          rm -rf "$appbundle"
          mkdir -p "$appbundle/Contents/MacOS" "$appbundle/Contents/Resources"
          # Extract ONLY the binary; licenses go in Contents/Resources, which is
          # where a .app bundle is expected to carry them.
          tar -xzf "$tgz" -C "$appbundle/Contents/MacOS" scr1b3
          chmod 0755 "$appbundle/Contents/MacOS/scr1b3"
          # License texts inside the bundle (OFL-1.1 s2). Mandatory: the
          # collector fails the job rather than shipping a breach.
          sh app/packaging/collect-licenses.sh app "$appbundle/Contents/Resources/licenses"
          # Info.plist: reuse the committed template, substitute the real version
          # into the two 0.1.0 placeholders (CFBundleVersion + ShortVersionString).
          sed -E "s|<string>0\.1\.0</string>|<string>${VER}</string>|g" \
            app/packaging/macos/Info.plist > "$appbundle/Contents/Info.plist"
          # .icns from the 1024px master PNG (iconutil + sips are preinstalled).
          iconset="scr1b3.iconset"
          rm -rf "$iconset"; mkdir -p "$iconset"
          src1024="app/assets/icons/hicolor/1024x1024/apps/scr1b3.png"
          for sz in 16 32 64 128 256 512; do
            sips -z "$sz" "$sz" "$src1024" --out "$iconset/icon_${sz}x${sz}.png" >/dev/null
            d=$((sz * 2)); sips -z "$d" "$d" "$src1024" --out "$iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$appbundle/Contents/Resources/scr1b3.icns"

          # ---- .dmg (hdiutil, preinstalled) — drag-to-Applications layout ----
          stage="dmg-stage"
          rm -rf "$stage"; mkdir -p "$stage"
          cp -R "$appbundle" "$stage/"
          ln -s /Applications "$stage/Applications"
          dmg="dist/scr1b3-${TAG}-${{ matrix.arch }}.dmg"
          hdiutil create -volname "SCR1B3" -srcfolder "$stage" -ov -format UDZO "$dmg"

          # ---- checksum (macOS ships `shasum`, not `sha256sum`) --------------
          cd dist
          for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la; cat *.sha256
      - name: Upload macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scr1b3-macos-installer-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, windows-installer, windows-msi, linux-installers, macos-installer]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # Only this job writes to the repo (creates the Release + uploads assets).
      contents: write
      # SLSA build-provenance attestation via GitHub's OIDC + Sigstore: `id-token`
      # mints the OIDC token, `attestations` writes the signed provenance. This is
      # ADDITIVE to the minisign signatures — minisign attests AUTHOR identity
      # (the embedded key), provenance attests BUILD integrity (which workflow/
      # commit/runner produced each artifact), verifiable with `gh attestation
      # verify <file> --repo <repo>`.
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      # Checkout the SOURCE (into an isolated `src/` path that never clobbers
      # `dist/`) so the post-sign self-verify gate can reconstruct SCR1B3's OWN
      # embedded minisign public key from `verify.rs` and verify every signed
      # asset against exactly what the shipped binary's updater will accept.
      - name: Checkout source (for embedded-key self-verify)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      # Aggregate every per-artifact `.sha256` into ONE published `SHA256SUMS`
      # manifest, mirroring the sibling C0PL4ND release. Generated BEFORE the
      # signing step so the existing sign loop produces `SHA256SUMS.minisig` and
      # the fail-closed self-verify gate checks it like any other asset.
      #
      # Why: the release previously published FOUR files per artifact — X,
      # X.minisig, X.sha256 and X.sha256.minisig — i.e. a signature over a
      # checksum whose artifact is already independently signed. That
      # quadruplication was 28 of the 31 published assets and added no security
      # (nothing in this repo, the installer, or the updater ever fetched a
      # `.sha256.minisig`). One SIGNED aggregate manifest is strictly stronger
      # than N UNSIGNED per-artifact sidecars: `packaging/install.sh` now
      # verifies SHA256SUMS against the embedded key before reading a digest
      # out of it, so the checksum comparison is finally an authenticity
      # control rather than a corruption check.
      #
      # Each producing job runs its checksum tool from INSIDE its `dist/`, so
      # every `.sha256` line already carries the BARE published asset name —
      # exactly what a consumer greps for.
      - name: Aggregate checksums (SHA256SUMS)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shas < <(find dist -type f -name '*.sha256' | sort)
          if [ "${#shas[@]}" -eq 0 ]; then
            echo "::error::no .sha256 sidecars found under dist/ — refusing to publish a release with no checksum manifest"
            exit 1
          fi
          # NOT `cat *.sha256 > SHA256SUMS 2>/dev/null || true` — that form
          # publishes an EMPTY manifest when the glob misses, and an empty
          # SHA256SUMS still satisfies a `[ -f ]` guard downstream while making
          # every consumer's lookup fail.
          # `tr -d '\r'` is defence-in-depth against a CRLF-writing producer. The
          # sibling C0PL4ND release shipped a SHA256SUMS whose two Windows lines
          # ended in a stray CR (a PowerShell `Out-File`), which silently breaks
          # every exact-name lookup a consumer does. SCR1B3 generates all of its
          # sidecars from bash today, but the aggregate is load-bearing enough to
          # normalise unconditionally.
          cat "${shas[@]}" | tr -d '\r' | sort -u > dist/SHA256SUMS
          lines=$(grep -c . dist/SHA256SUMS || true)
          [ "$lines" -eq "${#shas[@]}" ] || {
            echo "::error::SHA256SUMS has $lines line(s) from ${#shas[@]} sidecar(s) — malformed or duplicated"; exit 1; }
          # Every published archive/installer MUST have a line. A silently
          # skipped checksum on one platform is exactly the defect this asserts
          # away (stock macOS has `shasum`, not `sha256sum`).
          missing=0
          while IFS= read -r a; do
            base=$(basename "$a")
            grep -qE "[ *]${base}\$" dist/SHA256SUMS || { echo "::error::no SHA256SUMS entry for $base"; missing=1; }
          done < <(find dist -type f \( -name '*.tar.gz' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \))
          [ "$missing" -eq 0 ] || exit 1
          echo "----- dist/SHA256SUMS -----"; cat dist/SHA256SUMS
      # Generate the Tier-1 signed-manifest payload (latest.json) BEFORE the
      # signing step, so the existing sign loop produces `latest.json.minisig`
      # and the fail-closed self-verify gate checks it like any other asset. The
      # manifest declares, per platform, {asset_name, sha256, size, url} plus
      # {version, release_index, minimum_version, valid_until_utc}; the in-app
      # updater (Tier-1 clients) verifies THIS manifest against the embedded key
      # and then pins each download's SHA-256 to the SIGNED digest here — making
      # artifact identity a SIGNED HASH, not an unsigned GitHub JSON field or a
      # tool-dependent trusted-comment string. `valid_until_utc` is the freeze
      # beacon; `minimum_version` is the signed anti-downgrade floor;
      # `release_index` is the monotonic anti-rollback ordinal. No extra checkout
      # is needed — the manifest is derived purely from the staged `dist/` assets
      # + the tag. `download-artifact` lands each asset in a per-target subdir
      # (`dist/scr1b3-<target>/<file>`), so the walk is RECURSIVE; the published
      # release flattens to bare names, so each asset_name + its download URL use
      # the basename.
      - name: Generate update manifest (latest.json, Tier 1)
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - "$REPO" "$TAG" <<'PY'
          import sys, os, json, hashlib, datetime
          repo, tag = sys.argv[1], sys.argv[2]
          ver = tag[1:] if tag.startswith("v") else tag
          dist = "dist"
          TRIPLES = (
              "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
              "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin", "aarch64-apple-darwin",
          )
          def platform_of(name):
              for t in TRIPLES:
                  if t in name:
                      return t
              # The native CRT installer (scr1b3-<tag>-x86_64-setup.exe) carries no
              # full triple in its name but is a Windows x64 asset.
              if name.endswith(".exe"):
                  return "x86_64-pc-windows-msvc"
              return None
          def kind_of(name):
              if name.endswith(".zip"): return "zip"
              if name.endswith(".tar.gz"): return "tar.gz"
              if name.endswith(".exe"): return "exe"
              return "other"
          # Walk RECURSIVELY: download-artifact nests each asset under
          # dist/<artifact-name>/<file>. Dedup by basename (an asset_name is a
          # stable identity across the per-target subdirs).
          seen = {}
          for root, _dirs, files in os.walk(dist):
              for fn in files:
                  if not fn.endswith((".zip", ".tar.gz", ".exe")):
                      continue          # archives/installers only (skip sidecars/SBOMs/licenses)
                  plat = platform_of(fn)
                  if plat is None:
                      continue
                  p = os.path.join(root, fn)
                  if not os.path.isfile(p) or fn in seen:
                      continue
                  with open(p, "rb") as fh:
                      digest = hashlib.sha256(fh.read()).hexdigest()
                  seen[fn] = {
                      "platform": plat, "kind": kind_of(fn), "asset_name": fn,
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{fn}",
                      "size": os.path.getsize(p), "sha256": digest,
                  }
          assets = sorted(seen.values(), key=lambda a: (a["platform"], a["asset_name"]))
          if not assets:
              print("::error::manifest generation found no archive/installer assets in dist/")
              sys.exit(1)
          core = ver.split("+")[0].split("-")[0].split(".")
          maj, minr, pat = (core + ["0", "0", "0"])[:3]
          release_index = int(maj) * 1_000_000 + int(minr) * 1_000 + int(pat)
          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
          fmt = "%Y-%m-%dT%H:%M:%SZ"
          manifest = {
              "schema": "itasha.update.manifest/v1",
              "product": "scr1b3",
              "version": ver,
              "release_index": release_index,
              # Raised to 0.4.63 (the first sidecar-tolerant updater —
              # `sidecar_urls` returning an EMPTY url for an absent sidecar
              # instead of a hard Err) BECAUSE this release stops publishing the
              # per-artifact `.sha256`. A client BELOW this floor is a pre-0.4.63
              # updater that still REQUIRES that sidecar; the floor check in
              # `resolve_update` runs BEFORE sidecar resolution, so such a client
              # is told "a fresh install is required" — a graceful message —
              # instead of the cryptic "missing its .sha256 sidecar" refusal it
              # would otherwise hit. v0.4.63+ clients verify via the signed
              # manifest SHA-256 and auto-update seamlessly.
              #
              # This floor MUST NOT be raised without a matching
              # `crates/scribe-core/src/update/net.rs` change, and it must name
              # the FIRST version whose updater tolerates the absent sidecar —
              # never a later one, which would strand clients needlessly.
              "minimum_version": "0.4.63",
              "published_utc": now.strftime(fmt),
              "valid_until_utc": (now + datetime.timedelta(days=14)).strftime(fmt),
              "assets": assets,
          }
          # Write the manifest at the TOP of dist/ so the existing sign loop
          # (`find dist -type f`) signs it and the release upload publishes it as
          # the bare `latest.json` (+ `latest.json.minisig`) the updater fetches.
          with open(os.path.join(dist, "latest.json"), "w", encoding="utf-8") as out:
              json.dump(manifest, out, indent=2, sort_keys=True)
              out.write("\n")
          print(f"manifest: v{ver} release_index={release_index} assets={len(assets)} valid_until={manifest['valid_until_utc']}")
          PY
          echo "----- dist/latest.json -----"
          cat dist/latest.json
      # Attest the BUILT artifacts before signing the sidecars — provenance
      # covers the build outputs themselves. Tier 2: this includes the Tier 1
      # signed manifest (dist/latest.json), not just the archives + installer,
      # so a verifier can prove every published asset (incl. the manifest that
      # binds them) was built by THIS workflow at THIS tag.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/**/*.tar.gz, dist/**/*.exe, dist/**/*.msi, dist/**/*.deb, dist/**/*.AppImage, dist/**/*.dmg, dist/latest.json, dist/SHA256SUMS"
      # Sign every release asset with minisign (via rsign2 — the same tool the
      # key was generated with; its signatures verify against the embedded key
      # through the app's `minisign-verify` crate). The passwordless secret key
      # is a repo secret, NEVER committed. When it is absent the step is a no-op
      # (artifacts ship checksummed but unsigned) — the in-script guard avoids
      # the secrets-in-`if` evaluation gotcha and fails safe.
      - name: Sign release artifacts + fail-closed self-verify gate (rsign2, when key provisioned)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          # The PUBLIC release key (a repo var) — the exact value the build job
          # embeds into the binary. Preferred over the committed source constant
          # so the gate verifies against what the shipped updater actually trusts.
          PUBKEY_VAR: ${{ vars.SCR1B3_MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            # This early return skips the signing AND the fail-closed self-verify
            # gate below it, in one move — so with the secret unprovisioned the
            # whole gate was unreachable and the release published artifacts the
            # in-app updater is built to REJECT, green. It is now ref-sensitive:
            # `require-signing-key.sh` EXITS 1 on a stable tag (hard failure), and
            # 0 for a prerelease tag or a non-tag ref (warning + unsigned, the
            # pre-existing behaviour, deliberately unchanged for non-tags).
            # It lives in a script so the gate can be executed — and therefore
            # shown to fail — by a test; an unfalsifiable gate is the defect.
            #
            # `src/` prefix, NOT a bare `packaging/…`: this job checks the repo
            # out with `path: src` and declares no `working-directory:`/
            # `defaults:`, so $PWD is $GITHUB_WORKSPACE and the tree is one level
            # down — the same reason the self-verify below reads
            # `src/crates/scribe-core/…`. Bare, `sh` exits 127 on a missing file
            # under `set -e`, so a PRERELEASE tag with no key HARD-FAILED
            # (the opposite of the documented warn-and-continue) and a stable tag
            # failed before its ::error:: could print — the right outcome for the
            # wrong reason. Pinned by
            # `the_release_signing_step_calls_the_key_guard_before_returning_early`,
            # which now asserts this prefix against the job's checkout `path:`.
            sh src/packaging/require-signing-key.sh
            exit 0
          fi
          cargo install rsign2 --locked --version "^0.6"
          umask 077
          # `cd` into each artifact's dir changes $PWD, so the key MUST be passed
          # by ABSOLUTE path.
          keypath="$PWD/sk.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keypath"
          # Sign the BARE filename from INSIDE each artifact's directory. minisign
          # records the EXACT arg passed to `sign` into the signature's trusted
          # comment as `file:<arg>`. Signing `dist/<target>/<asset>` would bake a
          # build-machine PATH into the comment (a latent footgun the moment any
          # verifier adds filename binding — the C0PL4ND auto-update outage);
          # signing the basename records `file:<asset>` (a stable identity).
          # `find` recurses the per-target subdirs `download-artifact` creates.
          count=0
          while IFS= read -r f; do
            base=$(basename "$f")
            ( cd "$(dirname "$f")" && rsign sign -W -s "$keypath" -x "${base}.minisig" "$base" )
            count=$((count + 1))
          done < <(find dist -type f ! -name '*.minisig')
          shred -u "$keypath" 2>/dev/null || rm -f "$keypath"
          echo "signed $count release artifact(s)"

          # --- Fail-closed self-verify gate -----------------------------------
          # Reconstruct SCR1B3's OWN embedded public key and verify EVERY signed
          # asset against it BEFORE publishing — the release can ship only what
          # the shipped binary's updater will accept. Prefer the provisioned repo
          # var; fall back to the committed `verify.rs` constant. Every check is a
          # HARD BLOCK (fail-closed) — a verify/identity/digest/parity/tamper
          # failure aborts the release.
          pub="${PUBKEY_VAR:-}"
          if [ -z "$pub" ]; then
            pub=$(grep -oE 'RW[A-Za-z0-9+/=]{40,}' src/crates/scribe-core/src/update/verify.rs | head -1)
          fi
          [ -n "$pub" ] || { echo "::error::no embedded pubkey found — cannot self-verify"; exit 1; }
          printf 'untrusted comment: scr1b3 minisign public key\n%s\n' "$pub" > rsign.pub
          assets=0; verified=0
          while IFS= read -r f; do
            base=$(basename "$f"); d=$(dirname "$f")
            assets=$((assets + 1))
            sig="$d/${base}.minisig"
            [ -f "$sig" ] || { echo "::error::missing signature for $base"; exit 1; }                                          # (A) coverage
            rsign verify -p rsign.pub -x "$sig" "$f" >/dev/null 2>&1 || { echo "::error::$base fails verify vs embedded key"; exit 1; }  # (C) crypto
            ft=$(grep -m1 '^trusted comment:' "$sig" | grep -oE 'file:[^[:space:]]+' | head -1 | sed 's/^file://')              # (D) identity
            case "$ft" in */*|*\\*) echo "::error::$sig comment carries a PATH ($ft)"; exit 1 ;; esac
            { [ -n "$ft" ] && [ "$ft" != "$base" ]; } && { echo "::error::$sig file:'$ft' != '$base'"; exit 1; }
            if [ -f "$d/${base}.sha256" ]; then                                                                                # (F) digest
              want=$(awk '{print $1; exit}' "$d/${base}.sha256"); got=$(sha256sum "$f" | awk '{print $1}')
              [ "$(printf %s "$want" | tr A-Z a-z)" = "$(printf %s "$got" | tr A-Z a-z)" ] || { echo "::error::$base sha256 mismatch"; exit 1; }
            fi
            verified=$((verified + 1))
          done < <(find dist -type f ! -name '*.minisig')
          # (0) non-vacuity. EVERY check above lives inside that loop, and the
          # parity check below reduces to `[ 0 -eq 0 ]`, so an empty `dist/`
          # skipped all of them and printed "release gate GREEN: 0 verified" —
          # a staging/download-artifact failure was indistinguishable from a
          # fully verified release. A gate that cannot fail is not a gate.
          [ "$assets" -gt 0 ] || { echo "::error::self-verify found ZERO assets under dist/ — nothing was checked. Refusing to report a pass."; exit 1; }
          nminisig=$(find dist -name '*.minisig' | wc -l | tr -d ' ')                                                          # (B) parity
          [ "$verified" -eq "$nminisig" ] || { echo "::error::sig parity $verified != $nminisig"; exit 1; }
          orig=$(find dist -type f ! -name '*.minisig' | head -1)                                                              # (G) tamper
          if [ -n "$orig" ]; then
            tf=$(mktemp); cp "$orig" "$tf"; printf '\x00' >> "$tf"
            if rsign verify -p rsign.pub -x "$(dirname "$orig")/$(basename "$orig").minisig" "$tf" >/dev/null 2>&1; then
              echo "::error::tamper test passed — gate broken"; exit 1
            fi
            rm -f "$tf"
          else
            # Unreachable while (0) holds, and deliberately kept as a second
            # latch: the tamper probe is the only check that proves the
            # verifier still REJECTS anything. Silently skipping it would let
            # a broken verifier ship a green release.
            echo "::error::no asset available for the tamper probe — cannot prove the verifier rejects modified bytes"; exit 1
          fi
          rm -f rsign.pub
          echo "release gate GREEN: $assets verified vs embedded key (crypto+identity+digest+parity+tamper)."
      # De-clutter the published asset list. The sign + fail-closed self-verify
      # gate above is UNCHANGED — it still signs and verifies EVERY staged file,
      # including each per-artifact `.sha256`, so the hardening (coverage,
      # crypto, identity, digest cross-check, count parity, tamper) is fully
      # intact. We only drop, AFTER the gate and BEFORE upload, the sidecars the
      # published set no longer needs:
      #
      #   * `<asset>.sha256`         — superseded by the SIGNED aggregate SHA256SUMS
      #   * `<asset>.sha256.minisig` — a signature over a checksum whose artifact
      #                                is already independently signed; nothing in
      #                                this repo, `packaging/install.sh`, or the
      #                                in-app updater has ever fetched one
      #
      # Every artifact KEEPS its own `<asset>.minisig` (the installer and the
      # updater both bind to it), and `latest.json` / `SHA256SUMS` keep theirs.
      # Net effect: ~31 published assets drop to ~17 with ZERO builds removed.
      - name: Prune superseded checksum sidecars before publish
        shell: bash
        run: |
          set -euo pipefail
          before=$(find dist -type f | wc -l | tr -d ' ')
          find dist -type f \( -name '*.sha256' -o -name '*.sha256.minisig' \) -delete
          after=$(find dist -type f | wc -l | tr -d ' ')
          echo "pruned $((before - after)) sidecar(s); ${after} asset(s) will be published"
          # Guard: the SIGNED aggregate manifests MUST survive the prune, and so
          # must every artifact's own signature. A prune that ate them would
          # strand both the installer and the in-app updater.
          for keep in latest.json latest.json.minisig SHA256SUMS SHA256SUMS.minisig; do
            [ -f "dist/$keep" ] || { echo "::error::prune removed required $keep"; exit 1; }
          done
          n_art=$(find dist -type f \( -name '*.tar.gz' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) | wc -l | tr -d ' ')
          n_sig=$(find dist -type f \( -name '*.tar.gz.minisig' -o -name '*.exe.minisig' -o -name '*.msi.minisig' -o -name '*.deb.minisig' -o -name '*.AppImage.minisig' -o -name '*.dmg.minisig' \) | wc -l | tr -d ' ')
          [ "$n_art" -eq "$n_sig" ] || { echo "::error::artifact/signature parity broken after prune ($n_art artifacts, $n_sig signatures)"; exit 1; }
          find dist -type f | sort
      - name: Create GitHub Release
        # `gh release` ships on every GitHub-hosted runner, so no third-party
        # action is needed (zizmor superfluous-actions). The default GITHUB_TOKEN
        # (job-scoped `contents: write`) authorises the release create + upload.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Collect every built artifact (flattened from the per-target dirs).
          mapfile -t assets < <(find dist -type f)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No artifacts found under dist/ — refusing to publish an empty release."
            exit 1
          fi
          # Idempotent: create the release if absent, else upload/clobber into it
          # (so a re-run after a partial failure recovers instead of erroring).
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes \
              "${assets[@]}"
          fi
          # Always finish PUBLISHED + marked latest. GitHub auto-demotes a
          # release to a draft when its tag is deleted, so a delete+re-push tag
          # (re-cut) would otherwise leave an invisible draft after the upload
          # path. This makes the release reliably public + installable.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
